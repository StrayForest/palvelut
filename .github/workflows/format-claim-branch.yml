name: Format claim branch

on:
  push:
    branches:
      - codex/p1-claim-publication-guard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact branch head
        env:
          BRANCH: codex/p1-claim-publication-guard
        run: |
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -B "$BRANCH" FETCH_HEAD

      - name: Format changed provider files
        working-directory: repo
        run: |
          python3 -m pip install --disable-pip-version-check --no-input "ruff==0.12.12"
          ruff format palvelut/apps/providers/models.py palvelut/apps/providers/migrations/0003_provider_claim_state.py palvelut/apps/providers/tests.py palvelut/apps/providers/management/commands/seed_demo.py

      - name: Commit formatting when needed
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: codex/p1-claim-publication-guard
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add palvelut/apps/providers/
          git commit -m "style: apply pinned ruff formatting"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
