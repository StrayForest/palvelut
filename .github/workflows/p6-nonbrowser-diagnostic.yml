name: P6 non-browser diagnostic

on:
  push:
    branches: [p6-russian-only-provider-registration]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: palvelut-p6-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Run canonical non-browser gate and capture output
        run: |
          set +e
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --profile quality build quality >p6-nonbrowser.log 2>&1
          build_status=$?
          if [ "$build_status" -eq 0 ]; then
            docker compose --project-name "$COMPOSE_PROJECT_NAME" --profile quality run --rm --no-deps quality bash infra/scripts/test-in-container.sh >>p6-nonbrowser.log 2>&1
            gate_status=$?
          else
            gate_status=$build_status
          fi
          printf '%s\n' "$gate_status" >p6-nonbrowser.status
          exit 0
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p6-nonbrowser-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            p6-nonbrowser.log
            p6-nonbrowser.status
          if-no-files-found: error
          retention-days: 1
      - name: Cleanup
        if: always()
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" down -v --remove-orphans || true
