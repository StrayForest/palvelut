name: Promote release

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable GHCR image digest (ghcr.io/strayforest/palvelut@sha256:...)
        required: true
        type: string
      release:
        description: Full 40-character source commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: palvelut-release-promotion
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate immutable release coordinates
        env:
          PALVELUT_IMAGE: ${{ inputs.image }}
          PALVELUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          [[ "$PALVELUT_IMAGE" =~ ^ghcr\.io/strayforest/palvelut@sha256:[0-9a-f]{64}$ ]]
          [[ "$PALVELUT_RELEASE" =~ ^[0-9a-f]{40}$ ]]

  staging:
    needs: validate
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Install staging SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Deploy exact digest to staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PALVELUT_IMAGE: ${{ inputs.image }}
          PALVELUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          printf -v remote 'cd /opt/palvelut/current && PALVELUT_IMAGE=%q PALVELUT_RELEASE=%q bash infra/scripts/deploy-production.sh deploy' "$PALVELUT_IMAGE" "$PALVELUT_RELEASE"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "$remote"

  production:
    needs: staging
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Install production SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Promote the same digest to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PALVELUT_IMAGE: ${{ inputs.image }}
          PALVELUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          printf -v remote 'cd /opt/palvelut/current && PALVELUT_IMAGE=%q PALVELUT_RELEASE=%q bash infra/scripts/deploy-production.sh deploy' "$PALVELUT_IMAGE" "$PALVELUT_RELEASE"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "$remote"
