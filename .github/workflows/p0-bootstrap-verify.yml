name: P0 bootstrap verify

on:
  pull_request:
    paths:
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "manage.py"
      - "palvelut/**"
      - "tests/**"
      - "tasks/P0-foundation.md"
      - "tasks/archive/P0-01-django-bootstrap.md"
      - ".github/workflows/p0-bootstrap-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Fetch exact PR head
        run: |
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install pinned uv
        working-directory: repo
        run: python3 -m pip install --disable-pip-version-check --no-input "uv==0.10.0"

      - name: Generate lock and verify runtime
        working-directory: repo
        run: |
          uv lock --refresh
          uv sync --locked
          .venv/bin/python manage.py check
          .venv/bin/python -m unittest -v tests.test_bootstrap_contract
          python -m compileall -q manage.py palvelut tests

      - name: Emit generated lock
        working-directory: repo
        run: |
          echo "UV_LOCK_BEGIN"
          base64 -w0 uv.lock
          echo
          echo "UV_LOCK_END"
