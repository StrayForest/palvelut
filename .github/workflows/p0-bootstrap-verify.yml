name: P0 bootstrap verify

on:
  push:
    branches:
      - "codex/p0-bootstrap"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact branch head
        run: |
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install pinned uv
        working-directory: repo
        run: python3 -m pip install --disable-pip-version-check --no-input "uv==0.10.0"

      - name: Generate lock and verify runtime
        working-directory: repo
        run: |
          uv lock --refresh
          uv sync --locked
          .venv/bin/python manage.py check
          .venv/bin/python -m unittest -v tests.test_bootstrap_contract
          .venv/bin/python -m compileall -q manage.py palvelut tests

      - name: Emit generated lock
        working-directory: repo
        run: |
          echo "UV_LOCK_BEGIN"
          base64 -w0 uv.lock
          echo
          echo "UV_LOCK_END"
