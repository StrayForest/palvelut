name: Ansible baseline

on:
  pull_request:
    paths:
      - "infra/ansible/**"
      - "infra/scripts/rehearsal-host-ci.sh"
      - "infra/scripts/restore-drill.sh"
      - "tests/test_p5_rehearsal_host_contract.py"
      - "tasks/P5-production.md"
      - "tasks/archive/P5-*.md"
      - ".github/workflows/p5-ansible.yml"

permissions:
  contents: read

jobs:
  ansible-baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install pinned Ansible tools
        working-directory: repo
        run: |
          python3 -m pip install --disable-pip-version-check --no-input \
            "ansible-core==2.21.3" \
            "ansible-lint==26.8.0"
          ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Verify Ansible syntax and lint
        working-directory: repo
        env:
          ANSIBLE_CONFIG: infra/ansible/ansible.cfg
        run: |
          ansible-playbook --syntax-check -i infra/ansible/inventory.example.yml infra/ansible/site.yml
          ansible-lint infra/ansible/site.yml

      - name: Bootstrap disposable Ubuntu host
        working-directory: repo
        run: bash infra/scripts/rehearsal-host-ci.sh bootstrap

      - name: Provision disposable host with production Ansible
        working-directory: repo
        env:
          ANSIBLE_CONFIG: infra/ansible/ansible.cfg
        run: |
          set -o pipefail
          bash infra/scripts/rehearsal-host-ci.sh provision | tee "$RUNNER_TEMP/palvelut-provision.log"

      - name: Identify failed Ansible task
        if: failure()
        id: failed-task
        run: |
          task="$(grep '^TASK \[' "$RUNNER_TEMP/palvelut-provision.log" | tail -n1 | sed -E 's/^TASK \[([^]]+)\].*/\1/' || true)"
          test -n "$task" || task="unknown-task"
          reason="$(grep -E 'fatal:|FAILED!' "$RUNNER_TEMP/palvelut-provision.log" | tail -n1 || true)"
          task_slug="$(printf '%s' "$task" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9._-')"
          reason_slug="$(printf '%s' "$reason" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9._-' | cut -c1-120)"
          test -n "$reason_slug" || reason_slug="no-reason"
          echo "artifact=ansible-failure-${task_slug}-${reason_slug}" >> "$GITHUB_OUTPUT"

      - name: Upload failed Ansible evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.failed-task.outputs.artifact }}
          path: ${{ runner.temp }}/palvelut-provision.log
          if-no-files-found: error
          retention-days: 1

      - name: Verify Ansible convergence and host services
        working-directory: repo
        env:
          ANSIBLE_CONFIG: infra/ansible/ansible.cfg
        run: bash infra/scripts/rehearsal-host-ci.sh converge

      - name: Run isolated encrypted restore fixture
        working-directory: repo
        run: bash infra/scripts/rehearsal-host-ci.sh restore

      - name: Cleanup disposable host
        if: always()
        working-directory: repo
        run: bash infra/scripts/rehearsal-host-ci.sh cleanup
