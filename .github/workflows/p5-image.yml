name: Production image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - name: Fetch exact commit
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init repo
          cd repo
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${SHA}"
          git checkout --detach FETCH_HEAD

      - name: Build immutable application image
        working-directory: repo
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/palvelut"
          docker build --pull=false --tag "${image}:${SHA}" .
          docker image inspect "${image}:${SHA}" >/dev/null

      - name: Generate SPDX SBOM for built image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/palvelut:${{ github.sha }}
          format: spdx-json
          output-file: repo/palvelut-${{ github.sha }}.spdx.json
          artifact-name: palvelut-${{ github.sha }}.spdx.json
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Scan built image for fixed critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/palvelut:${{ github.sha }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

      - name: Push commit-tagged image and report digest
        if: github.event_name != 'pull_request'
        working-directory: repo
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/palvelut"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "${image}:${SHA}"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${image}:${SHA}")"
          test -n "$digest"
          printf 'Immutable production image: %s\n' "$digest"
