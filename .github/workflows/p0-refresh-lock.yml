name: Refresh P0 Compose lock

on:
  push:
    branches:
      - codex/p0-compose-stack
    paths:
      - pyproject.toml
      - .github/workflows/p0-refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Refresh uv.lock on branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout codex/p0-compose-stack
          python3 -m pip install --disable-pip-version-check --no-input "uv==0.10.0"
          uv lock --refresh
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "P0: refresh runtime dependency lock"
          git push origin HEAD:codex/p0-compose-stack
