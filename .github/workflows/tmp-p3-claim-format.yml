name: Temporary P3 claim formatter

on:
  push:
    branches:
      - p3-claim-flow

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact branch head
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout -B p3-claim-flow FETCH_HEAD
      - name: Format changed Python files
        working-directory: repo
        run: |
          python3 -m pip install --disable-pip-version-check --no-input "ruff==0.12.12"
          ruff format \
            palvelut/apps/providers/claim_services.py \
            palvelut/apps/providers/claim_forms.py \
            palvelut/apps/providers/claim_views.py \
            palvelut/apps/providers/test_claim_flow.py \
            palvelut/urls.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add palvelut
          git commit -m "P3: apply ruff formatting"
          git push origin HEAD:p3-claim-flow
