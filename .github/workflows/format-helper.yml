name: Format helper

on:
  pull_request:
    paths:
      - ".github/workflows/format-helper.yml"

permissions:
  contents: write

jobs:
  format-helper:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install formatter
        run: python3 -m pip install --disable-pip-version-check --no-input "ruff==0.12.12"

      - name: Apply typing fix and push
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("palvelut/apps/taxonomy/migrations/0003_seed_finland_and_launch_categories.py")
          text = path.read_text()
          text = text.replace(
              "from django.db import migrations, models\n",
              "from typing import Any\n\nfrom django.db import migrations, models\n",
              1,
          )
          text = text.replace(
              "CATEGORIES = {",
              "CATEGORIES: dict[str, dict[str, Any]] = {",
              1,
          )
          path.write_text(text)
          PY

          ruff check --fix palvelut/apps/taxonomy/migrations/0003_seed_finland_and_launch_categories.py
          ruff format palvelut/apps/taxonomy/migrations/0003_seed_finland_and_launch_categories.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add palvelut/apps/taxonomy/migrations/0003_seed_finland_and_launch_categories.py
          git commit -m "fix: type taxonomy seed payload"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:codex/p1-taxonomy-seed
