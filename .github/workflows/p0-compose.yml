name: Compose stack

on:
  pull_request:

permissions:
  contents: read

jobs:
  compose-stack:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact PR head and base
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${BASE_SHA}"
          git branch ci-base FETCH_HEAD
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Show Ruff formatter diff
        working-directory: repo
        run: |
          python3 -m pip install --disable-pip-version-check --no-input "ruff==0.12.12"
          mapfile -t changed_python < <(git diff --name-only ci-base HEAD -- '*.py')
          ruff format --diff "${changed_python[@]}"
          exit 1
