name: Compose stack

on:
  pull_request:
    paths:
      - "Makefile"
      - "compose.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "palvelut/**"
      - "infra/nginx/**"
      - "infra/scripts/**"
      - "tests/test_bootstrap_contract.py"
      - "tests/test_compose_contract.py"
      - "tests/test_make_contract.py"
      - "tasks/P0-foundation.md"
      - "tasks/archive/**"
      - ".github/workflows/p0-compose.yml"

permissions:
  contents: read

jobs:
  compose-stack:
    name: compose-stack
    runs-on: ubuntu-24.04

    steps:
      - name: Fetch exact PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install pinned uv
        working-directory: repo
        run: python3 -m pip install --disable-pip-version-check --no-input "uv==0.10.0"

      - name: Verify dependency and command contracts
        working-directory: repo
        run: |
          uv lock --check
          uv sync --locked
          uv run python -m unittest -v tests.test_bootstrap_contract tests.test_compose_contract tests.test_make_contract

      - name: Run canonical non-browser test gate
        working-directory: repo
        run: make test

      - name: Run canonical disposable smoke gate
        working-directory: repo
        run: make smoke

      - name: Cleanup Compose stack
        if: always()
        working-directory: repo
        run: docker compose --project-name palvelut down -v --remove-orphans
