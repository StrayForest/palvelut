palvelut_deploy_user: palvelut
palvelut_ssh_port: 22
palvelut_root: /opt/palvelut
palvelut_secret_dir: /etc/palvelut
palvelut_nginx_site: /etc/nginx/sites-available/palvelut.conf
# Blue is the bootstrap slot; deploy-production.sh switches atomically between 8081/8082.
palvelut_upstream: http://127.0.0.1:8081

