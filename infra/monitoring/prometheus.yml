global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: palvelut
    metrics_path: /palvelut/internal/metrics
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          service: palvelut
          environment: production
