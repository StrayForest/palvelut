name: palvelut

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: palvelut.settings
  DJANGO_DEBUG: "1"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1],nginx
  POSTGRES_DB: palvelut
  POSTGRES_USER: palvelut
  POSTGRES_PASSWORD: palvelut-local-only
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  VALKEY_URL: redis://valkey:6379/0
  CELERY_BROKER_URL: redis://valkey:6379/1
  CELERY_RESULT_BACKEND: redis://valkey:6379/2
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: palvelut-local
  S3_SECRET_ACCESS_KEY: palvelut-local-only
  S3_BUCKET_NAME: palvelut-local

services:
  postgres:
    # PostgreSQL 18 alpine, resolved 2026-09-03; digest is authoritative.
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: palvelut
      POSTGRES_USER: palvelut
      POSTGRES_PASSWORD: palvelut-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # PostgreSQL 18+ stores data below a version-specific subdirectory.
      - postgres_data:/var/lib/postgresql

  valkey:
    # Valkey 8 alpine, resolved 2026-09-03; digest is authoritative.
    image: valkey/valkey:8-alpine@sha256:b21fd94099dcd4bc6b2b9230daef69b6558b887ad4a2a1afe56ff6e745a88cdb
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Mailpit local SMTP/web inbox, resolved 2026-09-03; digest is authoritative.
    image: axllent/mailpit:latest@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "127.0.0.1:8025:8025"

  minio:
    # MinIO local S3-compatible storage, resolved 2026-09-03; digest is authoritative.
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: palvelut-local
      MINIO_ROOT_PASSWORD: palvelut-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/palvelut/health/live', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "palvelut.celery:app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  nginx:
    # Nginx alpine, resolved 2026-09-03; digest is authoritative.
    image: nginx:alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  quality:
    build:
      context: .
      dockerfile: Dockerfile.quality
    environment: *app-environment
    profiles: ["quality"]
    volumes:
      - .:/workspace:ro

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    depends_on:
      nginx:
        condition: service_started
    ipc: host
    profiles: ["e2e"]
    volumes:
      - ./playwright-report:/tests/playwright-report
      - ./test-results:/tests/test-results

volumes:
  postgres_data:
  minio_data:
