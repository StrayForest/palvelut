name: palvelut

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: palvelut.settings
  DJANGO_DEBUG: "1"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
  POSTGRES_DB: palvelut
  POSTGRES_USER: palvelut
  POSTGRES_PASSWORD: palvelut-local-only
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  VALKEY_URL: redis://valkey:6379/0
  CELERY_BROKER_URL: redis://valkey:6379/1
  CELERY_RESULT_BACKEND: redis://valkey:6379/2
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: palvelut-local
  S3_SECRET_ACCESS_KEY: palvelut-local-only
  S3_BUCKET_NAME: palvelut-local

services:
  postgres:
    # PostgreSQL 18; digest is pinned after the P0-02 verification run.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: palvelut
      POSTGRES_USER: palvelut
      POSTGRES_PASSWORD: palvelut-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    # Valkey 8.x; digest is pinned after the P0-02 verification run.
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Local SMTP/web inbox only; digest is pinned after the P0-02 verification run.
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

  minio:
    # Local S3-compatible storage only; digest is pinned after the P0-02 verification run.
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: palvelut-local
      MINIO_ROOT_PASSWORD: palvelut-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "palvelut.celery:app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  nginx:
    # Nginx edge proxy; digest is pinned after the P0-02 verification run.
    image: nginx:alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  minio_data:
