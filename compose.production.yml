name: palvelut-production

x-app-environment: &app-environment
  PALVELUT_ENVIRONMENT: production
  PALVELUT_RELEASE: ${PALVELUT_RELEASE:?set PALVELUT_RELEASE to the deployed commit SHA}
  SENTRY_DSN: ${SENTRY_DSN:-}
  METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN outside Git}
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in the external production env file}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?set DJANGO_CSRF_TRUSTED_ORIGINS}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
  POSTGRES_DB: ${POSTGRES_DB:-palvelut}
  POSTGRES_USER: ${POSTGRES_USER:-palvelut}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  VALKEY_URL: redis://valkey:6379/0
  CELERY_BROKER_URL: redis://valkey:6379/1
  CELERY_RESULT_BACKEND: redis://valkey:6379/2
  EMAIL_HOST: ${EMAIL_HOST:?set EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?set DEFAULT_FROM_EMAIL}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?set S3_ENDPOINT_URL}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:?set S3_BUCKET_NAME}

services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-palvelut}
      POSTGRES_USER: ${POSTGRES_USER:-palvelut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [backend]

  valkey:
    image: valkey/valkey:8-alpine@sha256:b21fd94099dcd4bc6b2b9230daef69b6558b887ad4a2a1afe56ff6e745a88cdb
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - valkey_data:/data
    networks: [backend]

  web:
    image: ${PALVELUT_IMAGE:?set PALVELUT_IMAGE to ghcr.io/strayforest/palvelut@sha256:<digest>}
    pull_policy: always
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/palvelut/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8080:8000"
    networks: [backend]

  worker:
    image: ${PALVELUT_IMAGE:?set PALVELUT_IMAGE to ghcr.io/strayforest/palvelut@sha256:<digest>}
    pull_policy: always
    restart: unless-stopped
    command: ["celery", "-A", "palvelut.celery:app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    internal: true

volumes:
  postgres_data:
  valkey_data:
