{% extends "base.html" %}
{% block content %}
<main>
  <h1>Edit {{ provider.display_name }}</h1>
  {% if revision.status == "changes_requested" %}<p role="status">Corrections requested. Update the draft and submit again.</p>{% endif %}
  <form method="post" hx-post="." hx-trigger="change delay:500ms" hx-swap="none">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save draft</button>
  </form>
  <p><a href="{% url 'provider-workspace-preview' provider.id %}">Preview</a></p>
</main>
{% endblock %}
