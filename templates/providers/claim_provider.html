{% extends "base.html" %}
{% block content %}
<main class="mx-auto max-w-xl px-4 py-10">
  <h1 class="text-2xl font-semibold">Claim {{ provider.display_name }}</h1>
  <p class="mt-2">Provide independent business-control evidence. Staff must approve the claim before ownership is granted.</p>
  <form method="post" class="mt-6 space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="rounded bg-slate-900 px-4 py-2 text-white">Submit claim</button>
  </form>
</main>
{% endblock %}
