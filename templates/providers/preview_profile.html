{% extends "base.html" %}
{% block content %}
<main>
  <h1>Preview</h1>
  <h2>{{ payload.display_name }}</h2>
  <p>{{ payload.legal_name }}</p>
  {% if payload.y_tunnus %}<p>Y-tunnus: {{ payload.y_tunnus }}</p>{% endif %}
  <form method="post" action="{% url 'provider-workspace-submit' provider.id %}">
    {% csrf_token %}
    <button type="submit">Submit for review</button>
  </form>
  <p><a href="{% url 'provider-workspace-edit' provider.id %}">Back to edit</a></p>
</main>
{% endblock %}
