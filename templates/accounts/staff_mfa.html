{% extends "base.html" %}
{% block content %}
<main class="mx-auto max-w-lg px-4 py-10">
  <h1 class="text-2xl font-semibold">Staff MFA</h1>
  {% if not device.confirmed_at %}<p class="mt-4">Add this TOTP secret to your authenticator app: <code>{{ device.secret }}</code></p>{% endif %}
  <form method="post" class="mt-6 space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Verify</button>
  </form>
</main>
{% endblock %}
