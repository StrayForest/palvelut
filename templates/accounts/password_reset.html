{% extends "base.html" %}
{% block title %}Восстановить пароль · Finrix Palvelut{% endblock %}
{% block content %}
<section class="mx-auto max-w-lg py-8">
  <h1 class="text-3xl font-bold tracking-tight">Восстановить пароль</h1>
  <p class="mt-3 text-[#5E6A65]">Укажите электронную почту аккаунта специалиста. Если аккаунт существует, мы отправим ссылку для смены пароля.</p>
  <form method="post" class="mt-6 space-y-5 rounded-2xl border border-[#DDE3DF] bg-white p-5 [&_label]:block [&_input]:mt-1 [&_input]:w-full [&_input]:rounded-xl [&_input]:border [&_input]:border-[#DDE3DF] [&_input]:px-3 [&_input]:py-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="min-h-11 rounded-xl bg-[#12664F] px-5 py-3 font-semibold text-white" type="submit">Отправить ссылку</button>
  </form>
</section>
{% endblock %}
