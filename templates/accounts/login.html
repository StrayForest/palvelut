{% extends "base.html" %}
{% block content %}
<section class="mx-auto max-w-lg py-8">
  <p class="text-sm font-semibold uppercase tracking-wide text-slate-500">Provider workspace</p>
  <h1 class="mt-3 text-3xl font-bold tracking-tight">Sign in</h1>
  <p class="mt-3 text-slate-600">Sign in to start, claim or manage your provider profile.</p>

  <form method="post" class="mt-8 space-y-5 rounded-2xl border border-slate-200 p-5 sm:p-6 [&_p]:space-y-2 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_input]:block [&_input]:w-full [&_input]:max-w-full [&_input]:rounded-lg [&_input]:border [&_input]:border-slate-300 [&_input]:bg-white [&_input]:px-3 [&_input]:py-3 [&_input]:text-base">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="inline-flex min-h-11 items-center justify-center rounded-lg bg-slate-950 px-5 py-3 font-semibold text-white focus:outline-none focus:ring-2 focus:ring-slate-950 focus:ring-offset-2" type="submit">Sign in</button>
  </form>

  <p class="mt-5 text-sm"><a class="font-semibold underline underline-offset-4" href="{% url 'account-password-reset' %}">Forgot password?</a></p>
</section>
{% endblock %}
